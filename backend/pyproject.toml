[project]
name = "constella-api"
version = "0.1.0"
description = "Constella — account-twin revenue intelligence API for Creative Newtech"
authors = [
    { name = "Swayam Devendra Panchal", email = "175919264+SDP42@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14.0",
    "fastapi>=0.165.0",
    "langgraph>=1.2.24",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
]



[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
