# Render Blueprint — Constella API on the free plan (512 MB RAM, 0.1 CPU, sleeps after 15 min idle).
# The synthetic database and the trained model are produced during the build (faster machine), so the
# free instance only loads them at start-up. Lite mode skips the optional embedding model (TF-IDF fallback).
services:
  - type: web
    name: constella-cnl
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev && uv run python -m app.pipeline && uv run python -m app.bake
    startCommand: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CONSTELLA_LITE
        value: "true"
      - key: CONSTELLA_SECRET_KEY
        generateValue: true
      - key: CONSTELLA_CORS_ORIGINS
        value: '["https://constella-cnl.vercel.app"]'
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Optional: enables the Claude-powered copilot (otherwise the offline planner answers)
      - key: ANTHROPIC_API_KEY
        sync: false
