# Keeps the free Render instance awake during Indian daytime so judges never hit a cold start.
# Render free web services sleep after 15 minutes without traffic; pinging every 14 minutes prevents that.
# Window: ~08:30–23:30 IST (03:00–18:00 UTC): ~64 runs/day ≈ 1,920 Actions minutes/month (private-repo free quota is 2,000).
name: keep-alive
on:
  schedule:
    - cron: "*/14 3-17 * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API and frontend
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://constella-cnl.onrender.com/api/health) && echo "api $code" && [ "$code" = "200" ] && break
            sleep 20
          done
          curl -s -o /dev/null -w "web %{http_code}\n" -m 30 https://constella-cnl.vercel.app/
